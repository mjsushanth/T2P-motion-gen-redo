name: Deploy T2P-Reboot deck

# Adapted from the FinSights deck's own workflow (github.com/mjsushanth/FinSights,
# deck/.github/workflows/deploy-deck.yml), itself adapted from Slidev's official Pages
# workflow (sli.dev/guide/hosting). Every step is scoped to deck/ with working-directory,
# since this repo is not a Slidev-only repo.
#
# One-time prerequisite this workflow cannot do itself: Pages must already be enabled for
# this repo (Settings -> Pages -> Source: GitHub Actions), since actions/configure-pages'
# `enablement: true` input below needs repo-admin privilege to *create* a Pages site on
# first use, which the workflow's own GITHUB_TOKEN never has at any permission level.
# Confirmed via `gh api repos/.../pages` returning 404 before the one-time admin step;
# Joel ran that step directly (`gh api -X POST repos/.../pages -f build_type=workflow`,
# admin-scoped token) on 2026-09-16, so `enablement: true` below now succeeds -- it is
# not a no-op, it is verifying/confirming a site that already exists rather than
# attempting to create one. Left as `true` (the standard template default) rather than
# removed, since it is harmless once the site exists and self-documents the dependency;
# if this workflow is ever copied to a repo where Pages has NOT been enabled yet, this
# exact step is where it will fail, with a permissions-shaped error that is actually an
# account-level one -- see MJS_LIB_TOOLS/codex-skills/build-project-deck/references/
# slidev-operational.md for the full trap.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deck/**'
      - '.github/workflows/deploy-deck.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        working-directory: deck
        run: npm ci

      # package.json's build script already hardcodes --base /T2P-motion-gen-redo/,
      # matching this repo's name -- not passed again here to avoid a duplicate --base
      # flag reaching the underlying `slidev build` call.
      - name: Build
        working-directory: deck
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: deck/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
