<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" width="400" height="660" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6571"/>
    </marker>
    <marker id="ahT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f8f7d"/>
    </marker>
  </defs>

  <!-- caption input -->
  <rect x="40" y="6" width="320" height="34" rx="17" fill="none" stroke="#b9bec6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="200" y="28" text-anchor="middle" font-size="12.5" fill="#5a6571" font-style="italic">"a person walks forward, then turns left"</text>
  <line x1="200" y1="40" x2="200" y2="58" stroke="#5a6571" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- CLIP text encoder, frozen -->
  <rect x="70" y="60" width="260" height="52" rx="4" fill="#f2f6f5" stroke="#2f8f7d" stroke-width="1.4"/>
  <text x="200" y="82" text-anchor="middle" font-size="14" fill="#2d323a" font-weight="600">CLIP text encoder</text>
  <text x="200" y="99" text-anchor="middle" font-size="11.5" fill="#2f8f7d" letter-spacing="1.4">FROZEN — NEVER UPDATED</text>
  <line x1="200" y1="112" x2="200" y2="132" stroke="#5a6571" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- projection -->
  <rect x="100" y="134" width="200" height="34" rx="4" fill="none" stroke="#b9bec6" stroke-width="1"/>
  <text x="200" y="156" text-anchor="middle" font-size="12.5" fill="#2d323a">projected into pose space</text>

  <!-- conditioning rail down the left -->
  <path d="M 200 168 L 200 182 L 26 182 L 26 424" fill="none" stroke="#2f8f7d" stroke-width="1.4"/>
  <text x="14" y="320" font-size="11" fill="#2f8f7d" transform="rotate(-90 14 320)" text-anchor="middle" letter-spacing="1.2">CONDITIONING SIGNAL</text>

  <!-- UNet backbone, four resolution levels -->
  <rect x="60" y="196" width="300" height="292" rx="5" fill="none" stroke="#b9bec6" stroke-width="1.2"/>
  <text x="352" y="214" text-anchor="end" font-size="11.5" fill="#828891" letter-spacing="1.2">UNET DIFFUSION BACKBONE</text>

  <g font-size="12.5" fill="#2d323a">
    <rect x="80" y="226" width="264" height="52" rx="3" fill="#fafafa" stroke="#d3d7dc"/>
    <text x="92" y="247">level 1 — global posture, balance</text>
    <text x="92" y="266" font-size="11" fill="#828891">coarsest resolution</text>

    <rect x="80" y="288" width="264" height="42" rx="3" fill="#fafafa" stroke="#d3d7dc"/>
    <text x="92" y="314">level 2 — limb orientation</text>

    <rect x="80" y="340" width="264" height="42" rx="3" fill="#fafafa" stroke="#d3d7dc"/>
    <text x="92" y="366">level 3 — hand and foot placement</text>

    <rect x="80" y="392" width="264" height="52" rx="3" fill="#fafafa" stroke="#d3d7dc"/>
    <text x="92" y="413">level 4 — joint-to-joint detail</text>
    <text x="92" y="432" font-size="11" fill="#828891">finest resolution</text>
  </g>

  <!-- cross-attention injections -->
  <g stroke="#2f8f7d" stroke-width="1.3" marker-end="url(#ahT)" fill="none">
    <line x1="26" y1="252" x2="74" y2="252"/>
    <line x1="26" y1="309" x2="74" y2="309"/>
    <line x1="26" y1="361" x2="74" y2="361"/>
    <line x1="26" y1="418" x2="74" y2="418"/>
  </g>
  <text x="200" y="466" text-anchor="middle" font-size="11.5" fill="#2f8f7d">cross-attention at every resolution level</text>

  <!-- output -->
  <line x1="200" y1="488" x2="200" y2="508" stroke="#5a6571" stroke-width="1.2" marker-end="url(#ah)"/>
  <rect x="70" y="510" width="260" height="46" rx="4" fill="#f2f6f5" stroke="#2f8f7d" stroke-width="1.4"/>
  <text x="200" y="530" text-anchor="middle" font-size="13.5" fill="#2d323a" font-weight="600">3D pose sequence</text>
  <text x="200" y="547" text-anchor="middle" font-size="11.5" fill="#5a6571">66-dimensional skeletal representation</text>

  <!-- auxiliary constraints -->
  <path d="M 200 556 L 200 574" stroke="#5a6571" stroke-width="1.2" marker-end="url(#ah)"/>
  <rect x="34" y="576" width="332" height="74" rx="4" fill="none" stroke="#b9bec6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="200" y="595" text-anchor="middle" font-size="11.5" fill="#828891" letter-spacing="1.2">ANATOMICAL CONSTRAINTS IN THE OBJECTIVE</text>
  <g font-size="12" fill="#2d323a" text-anchor="middle">
    <text x="200" y="616">bone-length consistency · joint limits</text>
    <text x="200" y="635">kinematic-chain validation, pelvis to extremities</text>
  </g>
</svg>
